# Garage một nút cho mỗi khu vực (máy dev). CV của khu vực nào nằm ở Garage của khu vực đó.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret, admin_token lấy từ biến môi trường GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"

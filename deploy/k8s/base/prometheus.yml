# Prometheus của một khu vực chạy trên Kubernetes (R45, R69).
# Không liệt kê địa chỉ cố định: hỏi API của cụm các pod có nhãn metrics=true, mỗi bản pod là một target.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    region: ${REGION}

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['host.docker.internal:9093']

scrape_configs:
  - job_name: services
    kubernetes_sd_configs:
      - role: pod
        namespaces: {own_namespace: true}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_metrics]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      # Tên service lấy từ nhãn app (hr, attendance…), tên pod để phân biệt từng bản
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: instance
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: replica
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

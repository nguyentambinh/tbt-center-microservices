# Service nghiệp vụ của một khu vực. Gọi nhau bằng tên Service (DNS của cụm), probe kiểm GET /
# Nhân sự: 2 bản, Service chia đều request, HPA tăng tới 4
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr
spec:
  replicas: 2
  selector:
    matchLabels: {app: hr}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: hr, tier: service, metrics: "true"}
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres-primary -q; do sleep 2; done"]
      containers:
        - name: hr
          image: tbt/hr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: service-env}
            - configMapRef: {name: region}
            - secretRef: {name: postgres}
            - secretRef: {name: internal}
            - secretRef: {name: anthropic}
            - secretRef: {name: gemini}
            - secretRef: {name: garage}
            - secretRef: {name: identity}
          env:
            - {name: DB_NAME, value: hr_db}
            - {name: KEYCLOAK_ADMIN_URL, value: "http://host.docker.internal:8180"}
            - {name: S3_MEDIA_BUCKET, value: "tbt-media"}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 500m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hr
spec:
  selector: {app: hr}
  ports:
    - {name: http, port: 8080, targetPort: http}
---

# Đọc outbox các service, đẩy lên audit; đồng bộ kho tổng. Một bản để không gửi trùng sự kiện
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-worker
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sync-worker}
  template:
    metadata:
      labels: {app: sync-worker, tier: worker}
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres-primary -q; do sleep 2; done"]
      containers:
        - name: sync-worker
          image: tbt/sync_worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: region}
            - secretRef: {name: postgres}
            - secretRef: {name: sync}
            - secretRef: {name: datakey}
          env:
            - {name: DB_PRIMARY_HOST, value: postgres-primary}
            - {name: DB_PORT, value: "5432"}
            - {name: SYNC_SERVICES, value: "hr,attendance,payroll,recruitment,finance,project_contract,admin"}
            - {name: HUB_AUDIT_URL, value: "http://host.docker.internal:8195/events"}
            - {name: DATASTORE_URL, value: "http://host.docker.internal:8197/internal/ingest"}
            - {name: FIRESTORE_SA, value: /run/secrets/firestore.json}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 300m, memory: 192Mi}
          volumeMounts:
            - {name: firestore, mountPath: /run/secrets/firestore.json, subPath: firestore.json, readOnly: true}
      volumes:
        - name: firestore
          secret: {secretName: firestore}

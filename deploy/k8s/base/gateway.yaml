# Cổng vào khu vực: WAF (ModSecurity + OWASP CRS) → Kong → Service. Chỉ WAF mở ra ngoài cụm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  replicas: 1
  selector:
    matchLabels: {app: kong}
  template:
    metadata:
      labels: {app: kong, tier: gateway}
    spec:
      containers:
        - name: kong
          image: kong:3.9
          imagePullPolicy: IfNotPresent
          env:
            - {name: KONG_DATABASE, value: "off"}
            - {name: KONG_DECLARATIVE_CONFIG, value: /kong/kong.yml}
            - {name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000"}
            - {name: KONG_ADMIN_LISTEN, value: "off"}
            - {name: KONG_STATUS_LISTEN, value: "0.0.0.0:8100"}
            - {name: KONG_NGINX_WORKER_PROCESSES, value: "2"}
            - {name: KONG_DNS_ORDER, value: "LAST,A,CNAME"}
          ports:
            - {name: proxy, containerPort: 8000}
            - {name: status, containerPort: 8100}
          readinessProbe:
            httpGet: {path: /status/ready, port: status}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /status, port: status}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /kong}
      volumes:
        - name: config
          configMap: {name: kong-config}
---
apiVersion: v1
kind: Service
metadata:
  name: kong
spec:
  selector: {app: kong}
  ports:
    - {name: proxy, port: 8000, targetPort: proxy}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
spec:
  replicas: 1
  selector:
    matchLabels: {app: waf}
  template:
    metadata:
      labels: {app: waf, tier: gateway}
    spec:
      containers:
        - name: waf
          image: owasp/modsecurity-crs:nginx-alpine
          imagePullPolicy: IfNotPresent
          env:
            - {name: BACKEND, value: "http://kong:8000"}
            - {name: PARANOIA, value: "1"}
            - {name: BLOCKING_PARANOIA, value: "1"}
            - {name: ANOMALY_INBOUND, value: "5"}
            - {name: ANOMALY_OUTBOUND, value: "4"}
            - {name: ALLOWED_METHODS, value: "GET HEAD POST OPTIONS PUT PATCH DELETE"}
            - {name: MODSEC_AUDIT_LOG_FORMAT, value: JSON}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
# Cổng duy nhất mở ra ngoài cụm; k3d chuyển cổng 8000 của máy vào nodePort này
apiVersion: v1
kind: Service
metadata:
  name: waf
spec:
  type: NodePort
  selector: {app: waf}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30800}

# Ngoại lệ CRS cho WAF trước Kong của khu vực.
# Màn quản trị gửi câu SQL trong trường JSON "sql" của POST /admin/sql; các luật
# dò SQL injection (thẻ attack-sqli) chỉ bỏ cho đúng trường đó trên đúng đường đó.
# Đường này vẫn phải có JWT vai trò admin, và mọi câu chạy đều ghi sổ kiểm toán.
SecRule REQUEST_URI "@streq /admin/sql" \
    "id:1000201,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.sql"

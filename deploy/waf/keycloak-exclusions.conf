# Ngoại lệ CRS cho WAF trước Keycloak (ADR 0023).
# Luật 930120 (dò file .aws/credentials) khớp nhầm tên trường JSON "credentials"
# khi recruitment tạo tài khoản qua Admin API; chỉ bỏ kiểm tên trường của luật này
# trên đường /admin/realms/, mọi luật khác vẫn giữ.
SecRule REQUEST_URI "@beginsWith /admin/realms/" \
    "id:1000101,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS_NAMES"
